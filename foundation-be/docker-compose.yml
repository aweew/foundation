services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: foundation
      MYSQL_USER: ${DB_USERNAME:-foundation}
      MYSQL_PASSWORD: ${DB_PASSWORD:-foundation-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-foundation-local-root-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - foundation-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - foundation-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  foundation-mysql:
  foundation-redis:
